<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Artefacto de ejemplo</title>
<style>
  :root { --bg:#faf9f5; --ink:#141413; --muted:#6b6a65; --accent:#c2410c; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1a1917; --ink:#ecebe6; --muted:#a3a29c; --accent:#fb923c; } }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink);
         font:16px/1.6 system-ui, -apple-system, sans-serif; padding:16px; box-sizing:border-box; }
  main { max-width:520px; }
  h1 { margin:0 0 .5rem; font-size:1.8rem; }
  p { color:var(--muted); margin:0 0 1rem; }
  button { font:inherit; font-weight:600; background:var(--accent); color:#fff; border:0; border-radius:8px; padding:10px 18px; cursor:pointer; }
</style>
</head>
<body>
<main>
  <h1>Artefacto de ejemplo</h1>
  <p>Esta página es un marcador de posición. Bórrala con <code>npm run remove -- ejemplo</code> cuando añadas tus artefactos.</p>
  <button id="b">Has hecho clic 0 veces</button>
</main>
<script>
  let n = 0; const b = document.getElementById('b');
  b.onclick = () => { b.textContent = `Has hecho clic ${++n} ${n === 1 ? 'vez' : 'veces'}`; };
</script>
</body>
</html>
